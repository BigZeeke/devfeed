# NGINX site config for the DevFeed frontend container.
# Serves the built React app and proxies API requests to the Django backend,
# so the browser sees one origin and no CORS headers are needed.
# frontend/Dockerfile copies this over /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;

    # The built app (copied from the Dockerfile's build stage)
    root /usr/share/nginx/html;
    index index.html;

    # API requests go to Gunicorn in the backend container. "backend" is the
    # Compose service name; NGINX looks it up when it starts.
    location /api/ {
        proxy_pass http://backend:8000;
        # Keep the browser's host name so Django's ALLOWED_HOSTS check sees
        # 127.0.0.1 or the real domain, not "backend"
        proxy_set_header Host $host;
        # Pass the client's address and scheme on to Django
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: serve the file if it exists, otherwise index.html, so
    # React Router handles paths like /login and /signup on a page reload
    location / {
        try_files $uri $uri/ /index.html;
    }
}
